<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pemain Video</title>
  <link rel="stylesheet" href="styleABC.css">
  <style>
    .video-container {
      width: 100%;
      height: 260px;
      margin-top: 15px;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
    }
    video { width: 100%; height: 100%; object-fit: contain; }
    .btn-return-home { background: #64748b; color: white; margin-top: 20px; width: 100%; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-large-box">
      <img src="ABC LOGO.png" alt="ABC Logo" class="app-logo">
    </div>

    <h3 id="videoTitle" style="font-size: 22px; margin: 10px 0;">Pemain Video</h3>

    <div class="video-container">
      <video id="mainVideo" controls autoplay playsinline loop></video>
    </div>

    <button class="btn-return-home" onclick="goBack()">⬅ Kembali</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let type = urlParams.get('type') || 'stroke';
    let letter = urlParams.get('letter') || 'A'; 

    let titleElement = document.getElementById("videoTitle");
    let videoElement = document.getElementById("mainVideo");

    if (type === 'song') {
      titleElement.innerText = "🎶 Lagu ABC";
      titleElement.style.color = "#a855f7";
      videoElement.src = "ABC SONG.mp4";
    } else {
      titleElement.innerText = "🎥 Cara Menulis Huruf (" + letter.toUpperCase() + ")";
      titleElement.style.color = "#06b6d4";
      videoElement.src = "CARA MENULIS HURUF/" + letter.toUpperCase() + ".mp4";
    }

    // Menggunakan history browser untuk kembali ke state simpanan lepas
    function goBack() {
      window.history.back();
    }
  </script>
</body>
</html>
