<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pemain Video</title>
  <link rel="stylesheet" href="styleABC.css">
  <style>
    /* Reka bentuk kotak video yang fleksibel */
    .video-section-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
      width: 100%;
    }
    .video-block {
      width: 100%;
      background: #f8fafc;
      border-radius: 20px;
      padding: 10px;
      box-sizing: border-box;
      border: 2px solid #e2e8f0;
    }
    .video-label {
      font-size: 15px;
      font-weight: bold;
      color: #475569;
      margin-bottom: 6px;
    }
    .video-container {
      width: 100%;
      height: 180px;
      border-radius: 15px;
      overflow: hidden;
      background: #000;
    }
    video { width: 100%; height: 100%; object-fit: contain; }
    .btn-return-home { width: 100%; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-large-box">
      <img src="ABC LOGO.png" alt="ABC Logo" class="app-logo">
    </div>

    <h3 id="videoTitle" style="font-size: 22px; margin: 10px 0;">Pemain Video</h3>

    <div class="video-section-container">
      <div class="video-block" id="blockOne">
        <div class="video-label" id="labelOne">Video</div>
        <div class="video-container">
          <video id="mainVideo" controls autoplay playsinline loop></video>
        </div>
      </div>
      
      <div class="video-block" id="blockTwo" style="display: none;">
        <div class="video-label" id="labelTwo">Cara Menulis Huruf Kecil</div>
        <div class="video-container">
          <video id="secondVideo" controls playsinline loop></video>
        </div>
      </div>
    </div>

    <button class="btn-return-home" onclick="goBack()">⬅ Kembali</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let type = urlParams.get('type') || 'stroke';
    let letter = urlParams.get('letter') || 'A'; 

    let titleElement = document.getElementById("videoTitle");
    let videoElement = document.getElementById("mainVideo");
    let secondVideoElement = document.getElementById("secondVideo");
    
    let blockOne = document.getElementById("blockOne");
    let blockTwo = document.getElementById("blockTwo");
    let labelOne = document.getElementById("labelOne");

    if (type === 'song') {
      // Jika dipanggil dari butang "Play ABC Song"
      titleElement.innerText = "🎶 Lagu ABC";
      titleElement.style.color = "#a855f7";
      labelOne.innerText = "Lagu ABC";
      videoElement.src = "ABC SONG.mp4";
      blockTwo.style.display = "none";
    } else {
      // Jika dipanggil dari butang "Cara Menulis" (Papar 2 Video)
      titleElement.innerText = "🎥 Cara Menulis Huruf (" + letter.toUpperCase() + ")";
      titleElement.style.color = "#06b6d4";
      
      // Tetapan Video Huruf Besar
      labelOne.innerText = "Cara Menulis Huruf Besar (" + letter.toUpperCase() + ")";
      videoElement.src = "CARA MENULIS HURUF/" + letter.toUpperCase() + ".mp4";
      
      // Tetapan Video Huruf Kecil (Menggunakan format nama fail huruf_ .mp4)
      labelOne.nextElementSibling.children[0].id = "mainVideo"; 
      secondVideoElement.src = "CARA MENULIS HURUF/" + letter.toLowerCase() + "_.mp4";
      
      // Paparkan kotak video kedua
      blockTwo.style.display = "block";
      
      // Jalankan video kedua secara automatik bersama video pertama jika mahu
      secondVideoElement.play().catch(function() { console.log("Autoplay blocked for second video"); });
    }

    // Dibetulkan sepenuhnya untuk bertindak sama seperti anak panah belakang browser
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    }
  </script>
</body>
</html>
