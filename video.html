<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pemain Video</title>
  <link rel="stylesheet" href="styleABC.css">
  <style>
    .video-section-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
      width: 100%;
    }
    .video-block {
      width: 100%;
      background: #f8fafc;
      border-radius: 20px;
      padding: 10px;
      box-sizing: border-box;
      border: 2px solid #e2e8f0;
    }
    .video-label {
      font-size: 15px;
      font-weight: bold;
      color: #475569;
      margin-bottom: 6px;
    }
    .video-container {
      width: 100%;
      height: 180px;
      border-radius: 15px;
      overflow: hidden;
      background: #000;
    }
    video { width: 100%; height: 100%; object-fit: contain; }
    .btn-return-home { width: 100%; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-large-box">
      <img src="ABC LOGO.png" alt="ABC Logo" class="app-logo">
    </div>

    <h2 id="videoPageTitle" style="font-size: 24px; margin: 10px 0 5px 0;">🎥 Video Skrin</h2>

    <div class="video-section-container">
      
      <div class="video-block" id="videoBlockOne">
        <div class="video-label" id="labelVideoOne">Video Paparan</div>
        <div class="video-container">
          <video id="mainVideoPlayer" controls autoplay playsinline></video>
        </div>
      </div>

      <div class="video-block" id="videoBlockTwo" style="display: none;">
        <div class="video-label" id="labelVideoTwo">Video Tambahan</div>
        <div class="video-container">
          <video id="secondaryVideoPlayer" controls autoplay playsinline></video>
        </div>
      </div>

    </div>

    <button class="btn-retry btn-return-home" onclick="goBack()">⬅ Kembali</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type') || '';
    const letter = urlParams.get('letter') || 'A';

    const titleElement = document.getElementById("videoPageTitle");
    const videoElement = document.getElementById("mainVideoPlayer");
    const secondVideoElement = document.getElementById("secondaryVideoPlayer");
    
    const labelOne = document.getElementById("labelVideoOne");
    const labelTwo = document.getElementById("labelVideoTwo");
    
    const blockOne = document.getElementById("videoBlockOne");
    const blockTwo = document.getElementById("videoBlockTwo");

    if (type === 'song') {
      titleElement.innerText = "🎶 Lagu ABC";
      titleElement.style.color = "#9c27b0"; 
      labelOne.innerText = "Belajar Sambil Bernyanyi";
      videoElement.src = "LAGU/ABC SONG.mp4"; 
      blockTwo.style.display = "none";
      
    } else if (type === 'bonus_song') {
      titleElement.innerText = "🎶 Mengenal Huruf";
      titleElement.style.color = "#ec4899"; 
      labelOne.innerText = "Mengenal Huruf Besar & Kecil";
      videoElement.src = "LAGU/ABCs ALPHABET SONG.mp4";
      blockTwo.style.display = "none";
      
    } else if (type === 'letter_video') {
      let upper = letter.toUpperCase();
      let lower = letter.toLowerCase();
      
      titleElement.innerText = "🎥 Video Huruf " + upper + lower;
      titleElement.style.color = "#e91e63"; 
      labelOne.innerText = "Video Nyanyian & Bunyi Huruf";
      videoElement.src = "LAGU/" + upper + lower + ".mp4"; 
      blockTwo.style.display = "none"; 
      
    } else {
      titleElement.innerText = "🎥 Cara Menulis Huruf (" + letter.toUpperCase() + letter.toLowerCase() + ")";
      titleElement.style.color = "#06b6d4";
      
      labelOne.innerText = "Cara Menulis Huruf Besar (" + letter.toUpperCase() + ")";
      videoElement.src = "CARA MENULIS HURUF/" + letter.toUpperCase() + ".mp4";

      labelTwo.innerText = "Cara Menulis Huruf Kecil (" + letter.toLowerCase() + ")";
      secondVideoElement.src = "CARA MENULIS HURUF/" + letter.toLowerCase() + "_.mp4";
      blockTwo.style.display = "block";
    }

    window.onload = function() {
      videoElement.play().catch(function(e) { console.log("Main video autoplay blocked", e); });
      if (blockTwo.style.display === "block") {
        secondVideoElement.play().catch(function(e) { console.log("Second video autoplay blocked", e); });
      }
    };

    function goBack() {
      let previousPage = sessionStorage.getItem("prevPage");
      if (previousPage && previousPage.includes("match.html")) {
        window.location.href = "match.html?letter=" + letter;
      } else {
        window.location.href = "index.html";
      }
    }
  </script>
</body>
</html>
