<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pemain Video</title>
  <link rel="stylesheet" href="styleABC.css">
  <style>
    .video-section-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
      width: 100%;
    }
    .video-block {
      width: 100%;
      background: #f8fafc;
      border-radius: 20px;
      padding: 10px;
      box-sizing: border-box;
      border: 2px solid #e2e8f0;
    }
    .video-label {
      font-size: 15px;
      font-weight: bold;
      color: #475569;
      margin-bottom: 6px;
    }
    .video-container {
      width: 100%;
      height: 180px;
      border-radius: 15px;
      overflow: hidden;
      background: #000;
    }
    video { width: 100%; height: 100%; object-fit: contain; }
    .btn-return-home { width: 100%; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-large-box">
      <img src="ABC LOGO.png" alt="ABC Logo" class="app-logo">
    </div>

    <h3 id="videoTitle" style="font-size: 22px; margin: 10px 0;">Pemain Video</h3>

    <div class="video-section-container">
      <div class="video-block" id="blockOne">
        <div class="video-label" id="labelOne">Video</div>
        <div class="video-container">
          <video id="mainVideo" controls autoplay playsinline muted loop></video>
        </div>
      </div>
      
      <div class="video-block" id="blockTwo" style="display: none;">
        <div class="video-label" id="labelTwo">Cara Menulis Huruf Kecil</div>
        <div class="video-container">
          <video id="secondVideo" controls autoplay playsinline muted loop></video>
        </div>
      </div>
    </div>

    <button class="btn-return-home" onclick="goBack()">⬅ Kembali</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let type = urlParams.get('type') || 'stroke';
    let letter = urlParams.get('letter') || 'A'; 

    let titleElement = document.getElementById("videoTitle");
    let videoElement = document.getElementById("mainVideo");
    let secondVideoElement = document.getElementById("secondVideo");
    
    let blockOne = document.getElementById("blockOne");
    let blockTwo = document.getElementById("blockTwo");
    let labelOne = document.getElementById("labelOne");

    if (type === 'song') {
      titleElement.innerText = "🎶 Lagu ABC";
      titleElement.style.color = "#a855f7";
      labelOne.innerText = "Lagu ABC";
      videoElement.src = "LAGU/ABC SONG.mp4";
      blockTwo.style.display = "none";
      
    } else if (type === 'bonus_song') {
      titleElement.innerText = "🔤 Belajar Huruf Besar & Kecil";
      titleElement.style.color = "#ec4899";
      labelOne.innerText = "Mengenal Huruf Besar & Kecil";
      videoElement.src = "LAGU/ABCs ALPHABET SONG.mp4";
      blockTwo.style.display = "none";
      
    } else if (type === 'letter_video') {
      let upper = letter.toUpperCase();
      let lower = letter.toLowerCase();
      
      titleElement.innerText = "🎥 Video Huruf " + upper + lower;
      titleElement.style.color = "#e91e63"; 
      labelOne.innerText = "Video Nyanyian & Bunyi Huruf";
      videoElement.src = "LAGU/" + upper + lower + ".mp4"; 
      blockTwo.style.display = "none"; 
      
    }else {
      titleElement.innerText = "🎥 Cara Menulis Huruf (" + letter.toUpperCase() + letter.toLowerCase() + ")";
      titleElement.style.color = "#06b6d4";
      
      labelOne.innerText = "Cara Menulis Huruf Besar (" + letter.toUpperCase() + ")";
      videoElement.src = "CARA MENULIS HURUF/" + letter.toUpperCase() + ".mp4";

      labelTwo.innerText = "Cara Menulis Huruf Kecil (" + letter.toLowerCase() + ")";
      secondVideoElement.src = "CARA MENULIS HURUF/" + letter.toLowerCase() + "_.mp4";
      blockTwo.style.display = "block";
    }

    // Menguatkan jaminan autoplay berjalan lancar melalui kod skrip tambahan
    window.onload = function() {
      videoElement.play().catch(function(e) { console.log("Main video autoplay blocked", e); });
      if (blockTwo.style.display === "block") {
        secondVideoElement.play().catch(function(e) { console.log("Second video autoplay blocked", e); });
      }
    };

    function goBack() {
      let previousPage = sessionStorage.getItem("prevPage");
      if (previousPage && previousPage.includes("match.html")) {
        window.location.href = "match.html?letter=" + letter;
      } else {
        window.location.href = "index.html?letter=" + letter;
      }
    }
  </script>
</body>
</html>
