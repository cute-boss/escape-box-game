<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pilih Game</title>
  <link rel="stylesheet" href="styleABC.css">
  <style>
    h2 { color: #0284c7; font-size: 26px; margin: 5px 0 20px 0; }
    .game-menu-container { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
    .btn-g1 { background: #38bdf8; color: white; }
    .btn-g2 { background: #f43f5e; color: white; }
    .btn-g3 { background: #a855f7; color: white; }
    .btn-g4 { background: #34d399; color: white; }
    .btn-g5 { background: #fbbf24; color: #1e293b; }
    
    .navigation-divider {
      margin-top: 25px;
      border-top: 2px dashed #e2e8f0;
      padding-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-back { background: #64748b; color: white; }
    .btn-reset-home { background: #0284c7; color: white; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-large-box">
      <img src="ABC LOGO.png" alt="ABC Logo" class="app-logo">
    </div>

    <h2>🧩 Pilih Game</h2>

    <div class="game-menu-container">
      <button class="btn-g1" onclick="launchGame('https://wordwall.net/resource/74706396/uppercase-lowercase-alphabet-match')">🎯 Game 1: Find the Match</button>
      <button class="btn-g2" onclick="launchGame('https://wordwall.net/resource/98486528/uppercase-lowercase-alphabet-match')">✈ Game 2: Airplane Mode</button>
      <button class="btn-g3" onclick="launchGame('https://wordwall.net/resource/74705618/uppercase-lowercase-alphabet-match')">🛩 Game 3: Quiz Variant</button>
      <button class="btn-g4" onclick="launchGame('https://wordwall.net/resource/23644070/letter-match/letter-match')">🎈 Game 4: Balloon Pop</button>
      <button class="btn-g5" onclick="launchGame('https://wordwall.net/resource/66703372/matching-uppercase-and-lowercase-letters')">🐱 Game 5: Chase Game</button>
    </div>

    <div class="navigation-divider">
      <button class="btn-back" onclick="goBackHistory()">⬅ Kembali</button>
      <button class="btn-reset-home" onclick="goHome()">🔄 Scan Semula</button>
    </div>
  </div>

  <script>
    function launchGame(url) { window.open(url, "_blank"); }
    
    // Dipautkan dengan history tugasan asal browser
    function goBackHistory() {
      window.history.back();
    }
    
    function goHome() { window.location.href = "index.html"; }
  </script>
</body>
</html>
