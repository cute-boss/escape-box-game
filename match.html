<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pilih Game</title>
  <link rel="stylesheet" href="styleABC.css">
  <style>
    h2 { color: #0284c7; font-size: 24px; margin: 0px 0 10px 0; }
    .btn-g1 { background: #38bdf8; color: white; }
    .btn-g2 { background: #f43f5e; color: white; }
    .btn-g3 { background: #a855f7; color: white; }
    .btn-g4 { background: #34d399; color: white; }
    .btn-g5 { background: #fbbf24; color: #1e293b; }
    .btn-back-layout { width: 100%; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-large-box">
      <img src="ABC LOGO.png" alt="ABC Logo" class="app-logo">
    </div>

    <h2>🧩 Pilih Game</h2>

    <div class="game-grid-layout">
      <button class="btn-g1" onclick="launchGame('https://wordwall.net/resource/74706396/uppercase-lowercase-alphabet-match')">🎯 Game 1</button>
      <button class="btn-g2" onclick="launchGame('https://wordwall.net/resource/98486528/uppercase-lowercase-alphabet-match')">✈ Game 2</button>
      <button class="btn-g3" onclick="launchGame('https://wordwall.net/resource/74705618/uppercase-lowercase-alphabet-match')">🛩 Game 3</button>
      <button class="btn-g4" onclick="launchGame('https://wordwall.net/resource/23644070/letter-match/letter-match')">🎈 Game 4: Balloon</button>
      <button class="btn-g5" onclick="launchGame('https://wordwall.net/resource/66703372/matching-uppercase-and-lowercase-letters')">🐱 Game 5: Chase</button>
    </div>

    <div class="navigation-divider">
      <button class="btn-back btn-back-layout" onclick="goBackHistory()">⬅ Kembali</button>
      <button class="btn-reset-home" onclick="goHome()">🔄 Imbas Semula</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let letter = urlParams.get('letter') || '';

    // DIKEMASKINI: Sistem Audio untuk halaman match.html
    let matchBgMusic = new Audio("LAGU/BG SOUND.mpeg");
    matchBgMusic.loop = true;
    matchBgMusic.volume = 0.15;

    // Mainkan muzik sebaik sahaja halaman dibuka
    window.onload = function() {
      matchBgMusic.play().catch(function(err) {
        console.log("Muzik match disekat, menunggu klik pengguna:", err);
      });
    };

    function launchGame(url) {
      // Pastikan muzik diperlahankan atau dimatikan jika berpindah ke pautan luar game
      matchBgMusic.volume = 0.05; 
      window.open(url, '_blank');
    }

    function goBackHistory() {
      matchBgMusic.pause(); // Hentikan lagu
      let previousPage = sessionStorage.getItem("prevPage") || "index.html";
      window.location.href = previousPage;
    }

    function goHome() {
      matchBgMusic.pause(); // Hentikan lagu
      sessionStorage.removeItem("lastFirstBox");
      sessionStorage.removeItem("lastSecondBox");
      sessionStorage.removeItem("hasScanned");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
