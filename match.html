<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pilih Game</title>
  <link rel="stylesheet" href="styleABC.css">
  <style>
    h2 { color: #0284c7; font-size: 24px; margin: 0px 0 10px 0; }
    /* Memastikan susunan susun atur grid kemas pada skrin peranti */
    .game-grid-layout {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 15px 0;
    }
    .navigation-divider {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-large-box">
      <img src="ABC LOGO.png" alt="ABC Logo" class="app-logo">
    </div>

    <h2>🧩 Pilih Game</h2>

    <div class="game-grid-layout">
      <button style="background: #ff5722; color: white;" onclick="launchGame('https://wordwall.net/resource/74706396/uppercase-lowercase-alphabet-match')">🎯 Game 1</button>
      <button style="background: #e91e63; color: white;" onclick="launchGame('https://wordwall.net/resource/98486528/uppercase-lowercase-alphabet-match')">✈ Game 2</button>
      <button style="background: #9c27b0; color: white;" onclick="launchGame('https://wordwall.net/resource/74705618/uppercase-lowercase-alphabet-match')">🛩 Game 3</button>
      <button style="background: #00bcd4; color: white;" onclick="launchGame('https://wordwall.net/resource/23644070/letter-match/letter-match')">🎈 Game 4</button>
      <button style="background: #4caf50; color: white;" onclick="launchGame('https://wordwall.net/resource/66703372/matching-uppercase-and-lowercase-letters')">🐱 Game 5</button>
    </div>

    <div class="navigation-divider">
      <button style="background: #ff9800; color: white;" onclick="goBackHistory()">⬅ Kembali</button>
      <button style="background: #607d8b; color: white;" onclick="goHome()">🔄 Scan Semula</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let letter = urlParams.get('letter') || '';

    // KEMASKINI: Integrasi Audio latar belakang untuk match.html
    let matchBgMusic = new Audio("LAGU/BG SOUND.mpeg");
    matchBgMusic.loop = true;
    matchBgMusic.volume = 0.15;

    // Menjalankan audio sejurus halaman dibuka
    window.onload = function() {
      matchBgMusic.play().catch(function(err) {
        console.log("Muzik latar belakang disekat pelayar web:", err);
      });
    };

    function launchGame(url) {
      // Perlahankan volume audio asal jika pengguna sedang beralih ke tetingkap game luar
      matchBgMusic.volume = 0.05; 
      window.open(url, '_blank');
    }

    function goBackHistory() {
      matchBgMusic.pause();
      let previousPage = sessionStorage.getItem("prevPage") || "index.html";
      window.location.href = previousPage;
    }

    function goHome() {
      matchBgMusic.pause();
      sessionStorage.removeItem("lastFirstBox");
      sessionStorage.removeItem("lastSecondBox");
      sessionStorage.removeItem("hasScanned");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
