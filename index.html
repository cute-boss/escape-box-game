<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape Box Game</title>

<script>
  window.si = window.si || function () { 
    (window.siq = window.siq || []).push(arguments); 
  };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
/* UI Tema Taman Permainan Ceria & Terang untuk Kanak-Kanak */
body{
  margin:0;
  font-family: 'Comic Sans MS', 'Chalkboard SE', Arial, sans-serif;
  background: linear-gradient(135deg, #e0f2fe, #fae8ff); /* Biru langit & Pink lembut */
  color: #1e293b;
  text-align:center;
  padding-top:40px;
}
.card{
  display:inline-block;
  background: white;
  padding:25px;
  border-radius:30px;
  width:90%;
  max-width:380px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
  border: 4px solid #fed7aa; /* Garisan tepi warna oren pastel */
}
h2 {
  color: #0284c7;
  font-size: 26px;
  margin-top: 5px;
}
#lock{font-size:75px; margin-bottom: 10px;}
#icon{font-size:90px;margin:10px;}

/* Butang yang bulat dan ceria */
button{
  margin-top:12px;
  padding: 12px 20px;
  border:none;
  border-radius:50px;
  cursor: pointer;
  font-weight: bold;
  font-size: 16px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  transition: transform 0.2s;
}
button:active {
  transform: scale(0.95);
}
#btn1 {
  background: #38bdf8; /* Biru terang */
  color: white;
}
#btn2 {
  background: #f43f5e; /* Merah jambu ceria */
  color: white;
}
#btn2:disabled {
  background: #cbd5e1;
  color: #94a3b8;
  box-shadow: none;
}

/* Style Khusus untuk 3 Butang Menu Selepas Menang */
.action-buttons-container {
  display: none; /* Disembunyikan pada awal permainan */
  flex-direction: column;
  gap: 5px;
  margin-top: 15px;
}
#backBtn {
  background: #fbbf24; /* Kuning */
  color: #1e293b;
}
#abcSongBtn {
  background: #a855f7; /* Ungu */
  color: white;
}
#matchGameBtn {
  background: #ff7849; /* Oren */
  color: white;
}

.progress{
  width:85%;
  height:16px;
  background:#f1f5f9;
  margin:20px auto;
  border-radius:20px;
  border: 2px solid #e2e8f0;
  overflow: hidden;
}
.bar{
  height:100%;
  width:0%;
  background: linear-gradient(90deg, #4ade80, #22c55e); 
  border-radius:20px;
  transition:0.4s;
}
#reader{
  width:100%;
  display:none;
  margin-top:15px;
  border-radius: 20px;
  overflow: hidden;
  border: 3px dashed #38bdf8;
}

/* Ruang Iframe di lokasi kamera */
#gameAreaContainer {
  width:100%;
  height:280px;
  display:none;
  margin-top:15px;
  border-radius:20px;
  border:4px solid #4ade80;
  overflow:hidden;
  background:white;
  position: relative;
}
#gameIframe {
  width:100%;
  height:100%;
  border:none;
}
/* Kotak bantuan sandaran iframe */
#iframeFallbackBox {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #f8fafc;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 15px;
  box-sizing: border-box;
}

.good{color:#16a34a; font-size:24px; font-weight: bold;}
.bad{color:#dc2626; font-size:24px; font-weight: bold;}
</style>
</head>

<body>

<div class="card">

<h2>🎒 Escape Box Game</h2>

<div id="lock">🔒</div>
<div id="icon"></div>

<div class="progress">
  <div class="bar" id="bar"></div>
</div>

<div id="result" style="font-weight: bold; color: #475569;">Imbas kod untuk mula permainan</div>

<button id="btn1" onclick="startFirstScan()">📷 Scan Box Pertama</button>
<button id="btn2" onclick="startSecondScan()" disabled>📷 Scan Box Kedua</button>

<div id="reader"></div>

<div id="gameAreaContainer">
  <iframe id="gameIframe" src="" allow="autoplay"></iframe>
  
  <div id="iframeFallbackBox">
    <p style="font-size: 14px; color: #475569; font-weight: bold; margin-bottom: 10px;">Klik butang di bawah untuk mula belajar! 👇</p>
    <button id="fallbackPlayBtn" onclick="" style="background: #22c55e; color: white; padding: 10px 25px;">🎥 Play Video Huruf</button>
  </div>
</div>

<div id="actionButtons" class="action-buttons-container">
  <button id="abcSongBtn" onclick="openBonusLink('https://www.starfall.com/h/abcs/song/?mg=k')">🎶 Jom Menyanyi ABC!</button>
  <button id="matchGameBtn" onclick="openBonusLink('https://wordwall.net/resource/74706396/uppercase-lowercase-alphabet-match')">🧩 Game Padanan Huruf</button>
  <button id="backBtn" onclick="resetGame()">🔄 Main Semula</button>
</div>

</div>

<div id="videoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(11,18,32,0.9); z-index:99999;">
</div>

<script>

let firstBox=null;
const videoLinks = {
  A:"https://www.starfall.com/h/abcs/letter-a/?mg=k",
  B:"https://www.starfall.com/h/abcs/letter-b/?mg=k",
  C:"https://www.starfall.com/h/abcs/letter-c/?mg=k",
  D:"https://www.starfall.com/h/abcs/letter-d/?mg=k",
  E:"https://www.starfall.com/h/abcs/letter-e/?mg=k",
  F:"https://www.starfall.com/h/abcs/letter-f/?mg=k",
  G:"https://www.starfall.com/h/abcs/letter-g/?mg=k",
  H:"https://www.starfall.com/h/abcs/letter-h/?mg=k",
  I:"https://www.starfall.com/h/abcs/letter-i/?mg=k",
  J:"https://www.starfall.com/h/abcs/letter-j/?mg=k",
  K:"https://www.starfall.com/h/abcs/letter-k/?mg=k",
  L:"https://www.starfall.com/h/abcs/letter-l/?mg=k",
  M:"https://www.starfall.com/h/abcs/letter-m/?mg=k",
  N:"https://www.starfall.com/h/abcs/letter-n/?mg=k",
  O:"https://www.starfall.com/h/abcs/letter-o/?mg=k",
  P:"https://www.starfall.com/h/abcs/letter-p/?mg=k",
  Q:"https://www.starfall.com/h/abcs/letter-q/?mg=k",
  R:"https://www.starfall.com/h/abcs/letter-r/?mg=k",
  S:"https://www.starfall.com/h/abcs/letter-s/?mg=k",
  T:"https://www.starfall.com/h/abcs/letter-t/?mg=k",
  U:"https://www.starfall.com/h/abcs/letter-u/?mg=k",
  V:"https://www.starfall.com/h/abcs/letter-v/?mg=k",
  W:"https://www.starfall.com/h/abcs/letter-w/?mg=k",
  X:"https://www.starfall.com/h/abcs/letter-x/?mg=k",
  Y:"https://www.starfall.com/h/abcs/letter-y/?mg=k",
  Z:"https://www.starfall.com/h/abcs/letter-z/?mg=k"
};

let audioCtx=null;
let bgStarted=false;

/* ================= AUDIO INIT ================= */

function initAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }
}
function resumeAudio(){
  if(audioCtx && audioCtx.state==="suspended"){
    audioCtx.resume();
  }
}

/* ================= SOUND ================= */

function coinSound(){
  resumeAudio();
  let o=audioCtx.createOscillator();
  o.frequency.setValueAtTime(700,audioCtx.currentTime);
  o.frequency.linearRampToValueAtTime(1200,audioCtx.currentTime+0.1);
  o.connect(audioCtx.destination);
  o.start();
  setTimeout(()=>o.stop(),120);
}

function failSound(){
  resumeAudio();
  let o=audioCtx.createOscillator();
  o.frequency.setValueAtTime(300,audioCtx.currentTime);
  o.frequency.linearRampToValueAtTime(150,audioCtx.currentTime+0.2);
  o.connect(audioCtx.destination);
  o.start();
  setTimeout(()=>o.stop(),150);
}

function jumpSound(){
  resumeAudio();
  let o=audioCtx.createOscillator();
  o.frequency.setValueAtTime(400,audioCtx.currentTime);
  o.frequency.linearRampToValueAtTime(800,audioCtx.currentTime+0.15);
  o.connect(audioCtx.destination);
  o.start();
  setTimeout(()=>o.stop(),150);
}

/* ================= VOICE ================= */

let voices=[];
speechSynthesis.onvoiceschanged = () => {
  voices = speechSynthesis.getVoices();
};

function getBestVoice(){
  if(!voices.length) voices = speechSynthesis.getVoices();
  return voices.find(v =>
    v.lang.includes("ms") ||
    v.lang.includes("en") &&
    (v.name.toLowerCase().includes("female") ||
     v.name.toLowerCase().includes("girl") ||
     v.name.toLowerCase().includes("zira") ||
     v.name.toLowerCase().includes("samantha"))
  ) || voices[0];
}

function speak(text){
  speechSynthesis.cancel();
  let msg=new SpeechSynthesisUtterance(text);
  msg.voice=getBestVoice();
  msg.rate=1;
  msg.pitch=1.2; 
  speechSynthesis.speak(msg);
}

/* ================= BACKGROUND MUSIC ================= */

let bgMusic=new Audio("https://cdn.pixabay.com/audio/2022/10/25/audio_946b9c0c87.mp3");
bgMusic.loop=true;
bgMusic.volume=0;

function startMusic(){
  if(!bgStarted){
    bgStarted=true;
    bgMusic.play().then(()=>{
      fadeInMusic();
    }).catch(()=>{});
  }
}

function fadeInMusic(){
  let vol=0;
  let fade=setInterval(()=>{
    if(vol<0.15){
      vol+=0.01;
      bgMusic.volume=vol;
    }else{
      clearInterval(fade);
    }
  },200);
}

/* ================= PROGRESS ================= */

function setProgress(step){
  document.getElementById("bar").style.width=
    step===1?"50%":"100%";
}

/* ================= SCAN FIRST ================= */

function startFirstScan(){
  initAudio();
  resumeAudio();
  jumpSound();
  startMusic();

  document.getElementById("gameAreaContainer").style.display="none";
  document.getElementById("reader").style.display="block";

  let scanner = new Html5Qrcode("reader");
  
  scanner.start(
    { facingMode: { exact: "environment" } },
    {
      fps: 15,
      qrbox: 280,
      videoConstraints: {
        facingMode: { exact: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    },
    (text)=>{
      firstBox = text.includes("box=") ? text.split("box=")[1] : text;
      scanner.stop();
      coinSound();
      setProgress(1);
      document.getElementById("result").innerHTML = "✔ Box pertama: <b>" + firstBox + "</b><br>Seterusnya, scan box kedua";
      document.getElementById("btn2").disabled = false;
    }
  ).catch(err => {
      startFirstScanFallback();
  });
}

function startFirstScanFallback(){
  let scanner = new Html5Qrcode("reader");
  scanner.start(
    { facingMode: "environment" },
    {
      fps: 15, qrbox: 280,
      videoConstraints: { width: { ideal: 1280 }, height: { ideal: 720 } }
    },
    (text)=>{
      firstBox = text.includes("box=") ? text.split("box=")[1] : text;
      scanner.stop(); coinSound(); setProgress(1);
      document.getElementById("result").innerHTML = "✔ Box pertama: <b>" + firstBox + "</b><br>Seterusnya, scan box kedua";
      document.getElementById("btn2").disabled = false;
    }
  ).catch(err => alert("Sila semak kebenaran akses kamera peranti anda."));
}

/* ================= SCAN SECOND ================= */

function startSecondScan(){
  if(!firstBox){
    alert("Scan box pertama dulu!");
    return;
  }

  document.getElementById("gameAreaContainer").style.display="none";
  document.getElementById("reader").style.display="block";
  let scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: { exact: "environment" } },
    {
      fps: 15, 
      qrbox: 280,
      videoConstraints: {
        facingMode: { exact: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    },
    (text)=>{
      let secondBox = text.includes("box=") ? text.split("box=")[1] : text;
      scanner.stop();
      setProgress(2);
      check(secondBox);
    }
  ).catch(err => {
      startSecondScanFallback();
  });
}

function startSecondScanFallback(){
  let scanner = new Html5Qrcode("reader");
  scanner.start(
    { facingMode: "environment" },
    {
      fps: 15, qrbox: 280,
      videoConstraints: { width: { ideal: 1280 }, height: { ideal: 720 } }
    },
    (text)=>{
      let secondBox = text.includes("box=") ? text.split("box=")[1] : text;
      scanner.stop(); setProgress(2); check(secondBox);
    }
  ).catch(err => console.error(err));
}

/* ================= RESULT ================= */

function check(secondBox){
  let ok = (firstBox === secondBox);

  if(ok){
    coinSound();
    document.getElementById("icon").innerHTML="🎉";
    document.getElementById("icon").style.color="#22c55e";
    document.getElementById("lock").innerText="🔓";
    document.getElementById("result").innerHTML="<div class='good'>TAHNIAH ANDA BETUL! 🥳</div>";
    
    setTimeout(()=>{
      speak("Tahniah anda betul");
    },200);

    // Memuatkan iframe video huruf mengikut abjad box pertama
    if(videoLinks[firstBox]){
      loadIframeAtLocation(videoLinks[firstBox]);
    }
  } else {
    failSound();
    setTimeout(()=>{
      speak("Salah sila cuba lagi");
    },200);
    showFailGif();
  }

  // Sembunyikan butang kamera imbasan asal
  document.getElementById("btn1").style.display="none";
  document.getElementById("btn2").style.display="none";
  
  // BARU: Paparkan menu dengan 3 butang pilihan baharu
  document.getElementById("actionButtons").style.display="flex";
}

// Fungsi memuatkan iframe di lokasi kamera dengan pengesan khas
function loadIframeAtLocation(url){
  document.getElementById("reader").style.display = "none"; 
  
  let container = document.getElementById("gameAreaContainer");
  let frame = document.getElementById("gameIframe");
  let fallback = document.getElementById("iframeFallbackBox");
  
  frame.src = url;
  fallback.style.display = "none";
  container.style.display = "block";
  
  // Persediaan sokongan butang manual sekiranya pelayar menyekat muatan iframe luaran
  setTimeout(() => {
    document.getElementById("fallbackPlayBtn").setAttribute("onclick", `window.open('${url}', '_blank')`);
    fallback.style.display = "flex";
  }, 500);
}

// BARU: Fungsi untuk mengendalikan pembukaan pautan bonus (Lagu & Game)
function openBonusLink(url) {
  window.open(url, "_blank");
}

function showFailGif(){
  document.getElementById("videoModal").innerHTML = `
    <div style="height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#1e293b; font-family: Arial, sans-serif; padding: 20px;">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbXN6Ym90am9vN21ndm14cmMxZndpOHg0ZzZ5d3B5ZzF0bnd5cmh6ciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/E7V3EDm6866fD3wHhS/giphy.gif" style="width:200px; max-width:60%; border-radius:20px; margin-bottom: 10px;">
      <h2 style="font-size: 28px; margin: 10px 0; color: #ef4444;">Alamak! Cuba Lagi 🤭</h2>
      <p style="font-size: 16px; margin-bottom: 20px; color: #475569;">Kotak tidak sama. Sila imbas semula!</p>
      <button onclick="resetGame()" style="background: #22c55e; color: white; font-size: 18px; font-weight: bold; padding: 12px 30px; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); margin-top:0;">🔁 IMBAZ SEMULA</button>
    </div>
  `;
  document.getElementById("videoModal").style.display = "block";
}

/* ================= RESET ================= */

function resetGame(){
  bgMusic.pause();
  bgMusic.currentTime=0;
  location.reload();
}

</script>

</body>
</html>
