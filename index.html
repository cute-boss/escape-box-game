<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABC Game</title>
  <link rel="icon" type="image/png" href="ABC LOGO.png">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link rel="stylesheet" href="styleABC.css">
</head>
<body>

  <div class="card">
    <div class="logo-large-box">
      <img src="ABC LOGO.png" alt="ABC Logo" class="app-logo">
    </div>

    <div id="icon"></div>

    <div class="progress" style="width: 100%; background: #e2e8f0; height: 8px; border-radius: 4px; margin-bottom: 12px; overflow: hidden;">
      <div class="bar" id="bar" style="width: 0%; background: #4caf50; height: 100%; transition: width 0.3s;"></div>
    </div>

    <div id="result">Imbas kod untuk mula permainan</div>

    <button id="btn1" onclick="startFirstScan()">📷 Imbas Box Pertama</button>
    <button id="btn2" onclick="startSecondScan()" disabled>📷 Imbas Box Kedua</button>

    <div id="reader"></div>

    <div id="gameAreaContainer">
      <img id="flashcardImg" src="" alt="Flashcard View">
    </div>

    <div id="actionButtons" class="action-buttons-container" style="display: none;">
      <button class="btn-video" id="successVideoBtn">🎥 Video Huruf</button>
      <button class="btn-song" id="successWriteBtn">✍ Cara Menulis</button>
      <button class="btn-match" onclick="goToPlayABC()">🎶 Lagu ABC</button>
      <button style="background: #ff7849; color: white; margin-top: 5px;" onclick="goToPage('match.html')">🧩 Padanan Abjad</button>
      <button class="btn-retry" onclick="resetGame()">🔄 Imbas Semula</button>
    </div>

    <div id="failButtons" class="fail-buttons-container" style="display: none;">
      <button class="btn-video" id="failVideoBtn">🔤 Mengenal Huruf</button>
      <button class="btn-song" onclick="goToPlayABC()">🎶 Lagu ABC</button>
      <button class="btn-match" onclick="goToPage('match.html')">🧩 Alphabet Match</button>
      <button class="btn-retry" onclick="resetGame()">🔄 Imbas Semula</button>
    </div>

  </div>

  <script src="scriptABC.js"></script>
</body>
</html>
