<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABC Game</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link rel="stylesheet" href="styleABC.css">
</head>
<body>

  <div class="card">
    <div class="logo-large-box">
      <img src="ABC LOGO.png" alt="ABC Logo" class="app-logo">
    </div>

    <div id="icon"></div>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>

    <div id="result">Imbas kod untuk mula permainan</div>

    <button id="btn1" onclick="startFirstScan()">📷 Scan Box Pertama</button>
    <button id="btn2" onclick="startSecondScan()" disabled>📷 Scan Box Kedua</button>

    <div id="reader"></div>

    <div id="gameAreaContainer">
      <img id="flashcardImg" src="" alt="Flashcard View">
    </div>

    <div id="actionButtons" class="action-buttons-container">
      <button id="abcSongBtn" onclick="openBonusLink('https://www.starfall.com/h/abcs/song/?mg=k')">🎶 Jom Menyanyi ABC!</button>
      <button id="matchGameBtn" onclick="goToPage('match.html')">🧩 Game Padanan Huruf</button>
      <button id="backBtn" onclick="resetGame()">🔄 Main Semula</button>
    </div>

    <div id="failButtons" class="fail-buttons-container">
      <button class="btn-video" id="failVideoBtn">🎥 Video Huruf</button>
      <button class="btn-song" onclick="goToPlayABC()">🎶 Play ABC</button>
      <button class="btn-match" onclick="goToPage('match.html')">🧩 Alphabet Match</button>
      <button class="btn-retry" onclick="resetGame()">🔄 Scan Semula</button>
    </div>

  </div>

  <script src="scriptABC.js"></script>
</body>
</html>
