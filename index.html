<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escape Box Game</title>
  
  <link rel="icon" type="image/x-icon" href="ABC ICON.ico">
  
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <link rel="stylesheet" href="style.css.css">
</head>

<body>

  <div class="card">
    <div class="logo-container">
      <img src="ABC LOGO.png" alt="ABC Logo" class="app-logo">
    </div>

    <h2>🎒 Escape Box Game</h2>

    <div id="lock">🔒</div>
    <div id="icon"></div>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>

    <div id="result">Imbas kod untuk mula permainan</div>

    <button id="btn1" onclick="startFirstScan()">📷 Scan Box Pertama</button>
    <button id="btn2" onclick="startSecondScan()" disabled>📷 Scan Box Kedua</button>

    <div id="reader"></div>

    <div id="gameAreaContainer">
      <iframe id="gameIframe" src="" allow="autoplay"></iframe>
      
      <div id="iframeFallbackBox">
        <p class="fallback-text">Klik butang di bawah untuk mula belajar! 👇</p>
        <button id="fallbackPlayBtn" onclick="" class="fallback-btn">🎥 Play Video Huruf</button>
      </div>
    </div>

    <div id="actionButtons" class="action-buttons-container">
      <button id="abcSongBtn" onclick="openBonusLink('https://www.starfall.com/h/abcs/song/?mg=k')">🎶 Jom Menyanyi ABC!</button>
      <button id="matchGameBtn" onclick="openBonusLink('https://wordwall.net/resource/74706396/uppercase-lowercase-alphabet-match')">🧩 Game Padanan Huruf</button>
      <button id="backBtn" onclick="resetGame()">🔄 Main Semula</button>
    </div>
  </div>

  <div id="videoModal" class="modal-overlay"></div>

  <script src="script.js"></script>
</body>
</html>
