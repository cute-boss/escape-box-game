<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABC Game</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link rel="stylesheet" href="styleABC.css">
</head>
<body>

  <div class="card">
    <div class="logo-large-box">
      <img src="ABC LOGO.png" alt="ABC Logo" class="app-logo">
    </div>

    <div id="icon"></div>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>

    <div id="result">Imbas kod untuk mula permainan</div>

    <button id="btn1" onclick="startFirstScan()">📷 Scan Box Pertama</button>
    <button id="btn2" onclick="startSecondScan()" disabled>📷 Scan Box Kedua</button>

    <div id="reader"></div>

    <div id="gameAreaContainer">
      <img id="flashcardImg" src="" alt="Flashcard View">
    </div>

    <div id="actionButtons" class="action-buttons-container" style="display: none;">
      <button id="successVideoBtn">🎥 Video Huruf</button>
      <button id="successWriteBtn">✍ Cara Menulis</button>
      <button id="successPlayABCBtn" onclick="goToPlayABC()">🎶 Play ABC Song</button>
      <button id="successMatchBtn" onclick="goToPage('match.html')">🧩 Alphabet Match</button>
      <button id="successRetryBtn" onclick="resetGame()">🔄 Scan Semula</button>
    </div>

    <div id="failButtons" class="fail-buttons-container" style="display: none;">
      <button id="failVideoBtn">🎥 Video Huruf</button>
      <button id="failPlayABCBtn" onclick="goToPlayABC()">🎶 Play ABC</button>
      <button id="failMatchBtn" onclick="goToPage('match.html')">🧩 Alphabet Match</button>
      <button id="failRetryBtn" onclick="resetGame()">🔄 Scan Semula</button>
    </div>
  </div>

  <script src="scriptABC.js"></script>
</body>
</html>
