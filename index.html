<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape Box Game</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
  text-align:center;
  padding-top:40px;
}
.card{
  display:inline-block;
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  width:90%;
  max-width:380px;
}
#lock{font-size:65px;}
#icon{font-size:90px;margin:10px;}
button{
  margin-top:10px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor: pointer;
}
.progress{
  width:80%;
  height:10px;
  background:#334155;
  margin:15px auto;
  border-radius:10px;
}
.bar{
  height:100%;
  width:0%;
  background:#22c55e;
  transition:0.4s;
}
#reader{
  width:100%;
  display:none;
  margin-top:15px;
}
.good{color:#22c55e;font-size:24px;}
.bad{color:#ef4444;font-size:24px;}
</style>
</head>

<body>

<div class="card">

<h2>🔐 Escape Box Game</h2>

<div id="lock">🔒</div>
<div id="icon"></div>

<div class="progress">
  <div class="bar" id="bar"></div>
</div>

<div id="result">Imbas kod untuk mula permainan</div>

<button id="btn1" onclick="startFirstScan()">📷 Scan Box Pertama</button>
<button id="btn2" onclick="startSecondScan()" disabled>📷 Scan Box Kedua</button>
<button id="backBtn" onclick="resetGame()" style="display:none;">🔁 KEMBALI</button>

<div id="reader"></div>

</div>

<div id="videoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:99999;">
  <video id="videoPlayer" width="100%" height="100%" controls autoplay></video>
</div>

<script>

let firstBox=null;
const videoLinks = {
  A:"https://www.starfall.com/h/abcs/letter-a/?mg=k",
  B:"https://www.starfall.com/h/abcs/letter-b/?mg=k",
  C:"https://www.starfall.com/h/abcs/letter-c/?mg=k",
  D:"https://www.starfall.com/h/abcs/letter-d/?mg=k",
  E:"https://www.starfall.com/h/abcs/letter-e/?mg=k",
  F:"https://www.starfall.com/h/abcs/letter-f/?mg=k",
  G:"https://www.starfall.com/h/abcs/letter-g/?mg=k",
  H:"https://www.starfall.com/h/abcs/letter-h/?mg=k",
  I:"https://www.starfall.com/h/abcs/letter-i/?mg=k",
  J:"https://www.starfall.com/h/abcs/letter-j/?mg=k",
  K:"https://www.starfall.com/h/abcs/letter-k/?mg=k",
  L:"https://www.starfall.com/h/abcs/letter-l/?mg=k",
  M:"https://www.starfall.com/h/abcs/letter-m/?mg=k",
  N:"https://www.starfall.com/h/abcs/letter-n/?mg=k",
  O:"https://www.starfall.com/h/abcs/letter-o/?mg=k",
  P:"https://www.starfall.com/h/abcs/letter-p/?mg=k",
  Q:"https://www.starfall.com/h/abcs/letter-q/?mg=k",
  R:"https://www.starfall.com/h/abcs/letter-r/?mg=k",
  S:"https://www.starfall.com/h/abcs/letter-s/?mg=k",
  T:"https://www.starfall.com/h/abcs/letter-t/?mg=k",
  U:"https://www.starfall.com/h/abcs/letter-u/?mg=k",
  V:"https://www.starfall.com/h/abcs/letter-v/?mg=k",
  W:"https://www.starfall.com/h/abcs/letter-w/?mg=k",
  X:"https://www.starfall.com/h/abcs/letter-x/?mg=k",
  Y:"https://www.starfall.com/h/abcs/letter-y/?mg=k",
  Z:"https://www.starfall.com/h/abcs/letter-z/?mg=k"
};

let audioCtx=null;
let bgStarted=false;

/* ================= AUDIO INIT ================= */

function initAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }
}
function resumeAudio(){
  if(audioCtx && audioCtx.state==="suspended"){
    audioCtx.resume();
  }
}

/* ================= SOUND ================= */

function coinSound(){
  resumeAudio();
  let o=audioCtx.createOscillator();
  o.frequency.setValueAtTime(700,audioCtx.currentTime);
  o.frequency.linearRampToValueAtTime(1200,audioCtx.currentTime+0.1);
  o.connect(audioCtx.destination);
  o.start();
  setTimeout(()=>o.stop(),120);
}

function failSound(){
  resumeAudio();
  let o=audioCtx.createOscillator();
  o.frequency.setValueAtTime(300,audioCtx.currentTime);
  o.frequency.linearRampToValueAtTime(150,audioCtx.currentTime+0.2);
  o.connect(audioCtx.destination);
  o.start();
  setTimeout(()=>o.stop(),150);
}

function jumpSound(){
  resumeAudio();
  let o=audioCtx.createOscillator();
  o.frequency.setValueAtTime(400,audioCtx.currentTime);
  o.frequency.linearRampToValueAtTime(800,audioCtx.currentTime+0.15);
  o.connect(audioCtx.destination);
  o.start();
  setTimeout(()=>o.stop(),150);
}

/* ================= VOICE (FEMALE / CHILD) ================= */

let voices=[];
speechSynthesis.onvoiceschanged = () => {
  voices = speechSynthesis.getVoices();
};

function getBestVoice(){
  if(!voices.length) voices = speechSynthesis.getVoices();
  return voices.find(v =>
    v.lang.includes("ms") ||
    v.lang.includes("en") &&
    (v.name.toLowerCase().includes("female") ||
     v.name.toLowerCase().includes("girl") ||
     v.name.toLowerCase().includes("zira") ||
     v.name.toLowerCase().includes("samantha"))
  ) || voices[0];
}

function speak(text){
  speechSynthesis.cancel();

  let msg=new SpeechSynthesisUtterance(text);
  msg.voice=getBestVoice();
  msg.rate=1;
  msg.pitch=1.2; 

  speechSynthesis.speak(msg);
}

/* ================= BACKGROUND MUSIC ================= */

let bgMusic=new Audio("https://cdn.pixabay.com/audio/2022/10/25/audio_946b9c0c87.mp3");
bgMusic.loop=true;
bgMusic.volume=0;

function startMusic(){
  if(!bgStarted){
    bgStarted=true;
    bgMusic.play().then(()=>{
      fadeInMusic();
    }).catch(()=>{});
  }
}

function fadeInMusic(){
  let vol=0;
  let fade=setInterval(()=>{
    if(vol<0.15){
      vol+=0.01;
      bgMusic.volume=vol;
    }else{
      clearInterval(fade);
    }
  },200);
}

/* ================= PROGRESS ================= */

function setProgress(step){
  document.getElementById("bar").style.width=
    step===1?"50%":"100?";
}

/* ================= SCAN FIRST ================= */

function startFirstScan(){
  initAudio(); [cite: 16]
  resumeAudio(); [cite: 16]
  jumpSound(); [cite: 16]
  startMusic(); [cite: 16]

  document.getElementById("reader").style.display="block"; [cite: 16]

  let scanner = new Html5Qrcode("reader"); [cite: 16]
  
  scanner.start(
    { facingMode: "environment" }, [cite: 17]
    {
      fps: 15,             // Increased from 10 to 15 for smoother scanning
      qrbox: 280,          // Made the scanning box larger so you don't have to get too close
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true // Uses native hardware acceleration if available
      }
    },
    (text)=>{
      firstBox = text.includes("box=") ? text.split("box=")[1] : text; [cite: 17]
      scanner.stop(); [cite: 17]
      coinSound(); [cite: 17]
      setProgress(1); [cite: 17]
      document.getElementById("result").innerHTML = "✔ Box pertama: <b>" + firstBox + "</b><br>Scan box kedua"; [cite: 17]
      document.getElementById("btn2").disabled = false; [cite: 17]
    }
  ).catch(err => {
      console.error("Camera access failed:", err);
  });
}

/* ================= SCAN SECOND ================= */

function startSecondScan(){
  if(!firstBox){ [cite: 18]
    alert("Scan box pertama dulu!"); [cite: 18]
    return; [cite: 18]
  }

  document.getElementById("reader").style.display="block"; [cite: 18]
  let scanner = new Html5Qrcode("reader"); [cite: 19]

  scanner.start(
    { facingMode: "environment" }, [cite: 19]
    {
      fps: 15, 
      qrbox: 280, 
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    },
    (text)=>{
      let secondBox = text.includes("box=") ? text.split("box=")[1] : text; [cite: 19]
      scanner.stop(); [cite: 19]
      setProgress(2); [cite: 19]
      check(secondBox); [cite: 19]
    }
  ).catch(err => {
      console.error("Camera access failed:", err);
  });
}

/* ================= RESULT ================= */

function check(secondBox){
  let ok = (firstBox === secondBox);

  if(ok){
    coinSound();
    document.getElementById("icon").innerHTML="✔";
    document.getElementById("icon").style.color="#22c55e";
    document.getElementById("lock").innerText="🔓";
    document.getElementById("result").innerHTML="<div class='good'>TAHNIAH ANDA BETUL 🎉</div>";
    
    setTimeout(()=>{
      speak("Tahniah anda betul");
    },200);

    if(videoLinks[firstBox]){
      showVideo(videoLinks[firstBox]);
    }
  } else {
    failSound();
    setTimeout(()=>{
      speak("Salah sila cuba lagi");
    },200);
    showFailGif();
  }

  document.getElementById("btn1").style.display="none";
  document.getElementById("btn2").style.display="none";
  document.getElementById("backBtn").style.display="inline-block";
}

function showVideo(url){
  window.open(url, "_blank");
}

function showFailGif(){

document.getElementById("videoModal")
.innerHTML = `
<div style="
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
font-family: Arial, sans-serif;
padding: 20px;
">

<!-- Cute animated, kid-friendly "Wrong/Try Again" GIF -->
<img
src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbXN6Ym90am9vN21ndm14cmMxZndpOHg0ZzZ5d3B5ZzF0bnd5cmh6ciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/E7V3EDm6866fD3wHhS/giphy.gif"
style="width:200px; max-width:60%; border-radius:20px; margin-bottom: 10px;">

<h2 style="font-size: 28px; margin: 10px 0; color: #ef4444;">Alamak! Cuba Lagi 🤭</h2>
<p style="font-size: 16px; margin-bottom: 20px; color: #cbd5e1;">Kotak tidak sama. Sila imbas semula!</p>

<button onclick="resetGame()" style="
  background: #22c55e; 
  color: white; 
  font-size: 18px; 
  font-weight: bold; 
  padding: 12px 30px; 
  border: none; 
  border-radius: 50px; 
  cursor: pointer;
  box-shadow: 0 4px 6px rgba(0,0,0,0.2);
">
🔁 CUBA LAGI
</button>

</div>
`;

document.getElementById("videoModal")
.style.display = "block";

}

/* ================= RESET ================= */

function resetGame(){
  bgMusic.pause();
  bgMusic.currentTime=0;
  location.reload();
}

</script>

</body>
</html>
