<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape Box Game</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
  text-align:center;
  padding-top:40px;
}
.card{
  display:inline-block;
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  width:90%;
  max-width:380px;
}
#lock{font-size:65px;}
#icon{font-size:90px;margin:10px;}
button{
  margin-top:10px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor: pointer;
}
.progress{
  width:80%;
  height:10px;
  background:#334155;
  margin:15px auto;
  border-radius:10px;
}
.bar{
  height:100%;
  width:0%;
  background:#22c55e;
  transition:0.4s;
}
#reader{
  width:100%;
  display:none;
  margin-top:15px;
}

/* ================= STYLE MINI BROWSER BARU ================= */
#miniBrowserArea {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #0b1220;
  z-index: 9999;
  flex-direction: column;
}
/* Bar Navigasi Atas Mini Browser */
.browser-navbar {
  background: #1e293b;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}
.browser-navigation-btn {
  display: flex;
  gap: 8px;
}
.nav-arrow {
  background: #334155;
  color: white;
  padding: 8px 14px;
  font-weight: bold;
  font-size: 16px;
  margin: 0;
}
.nav-arrow:active {
  background: #475569;
}
.close-browser-btn {
  background: #ef4444;
  color: white;
  font-weight: bold;
  margin: 0;
  padding: 8px 20px;
  border-radius: 20px;
}
/* Kotak Kandungan Web */
.browser-container {
  width: 100%;
  flex-grow: 1;
  position: relative;
  background: white;
}
#miniBrowserFrame {
  width: 100%;
  height: 100%;
  border: none;
}
/* Kotak Amaran jika pautan disekat oleh pembekal web */
#browserBlockedNotice {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #1e293b;
  color: white;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
  box-sizing: border-box;
}

.good{color:#22c55e;font-size:24px;}
.bad{color:#ef4444;font-size:24px;}
</style>
</head>

<body>

<div id="mainGameCard" class="card">

<h2>🔐 Escape Box Game</h2>

<div id="lock">🔒</div>
<div id="icon"></div>

<div class="progress">
  <div class="bar" id="bar"></div>
</div>

<div id="result">Imbas kod untuk mula permainan</div>

<button id="btn1" onclick="startFirstScan()">📷 Scan Box Pertama</button>
<button id="btn2" onclick="startSecondScan()" disabled>📷 Scan Box Kedua</button>
<button id="backBtn" onclick="resetGame()" style="display:none;">🔁 KEMBALI</button>

<div id="reader"></div>

</div>

<div id="miniBrowserArea">
  <div class="browser-navbar">
    <div class="browser-navigation-btn">
      <button class="nav-arrow" onclick="browserBack()">⬅️ Back</button>
      <button class="nav-arrow" onclick="browserReload()">🔄 Refresh</button>
    </div>
    <span id="browserTitle" style="font-weight: bold; font-size: 14px; color: #cbd5e1; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Loading...</span>
    <button class="close-browser-btn" onclick="closeMiniBrowser()">🏠 UTAMA</button>
  </div>
  
  <div class="browser-container">
    <iframe id="miniBrowserFrame" src="" allow="autoplay"></iframe>
    
    <div id="browserBlockedNotice">
      <h3 style="color: #f59e0b;">Laman Web Dilindungi 🛡️</h3>
      <p style="font-size: 14px; color: #cbd5e1; max-width: 300px; margin-bottom: 20px;">Laman web ini memerlukan tetingkap penuh untuk dibuka dengan selamat supaya semua butang boleh ditekan.</p>
      <button id="externalLaunchBtn" onclick="" style="background: #22c55e; color: white; font-size: 16px; font-weight: bold; padding: 12px 25px; border-radius: 30px; box-shadow: 0 4px 10px rgba(34,197,94,0.3);">🚀 Buka Permainan</button>
    </div>
  </div>
</div>

<div id="videoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:99999;">
  <video id="videoPlayer" width="100%" height="100%" controls autoplay></video>
</div>

<script>

let firstBox=null;
let currentActiveUrl = "";
const videoLinks = {
  A:"https://www.starfall.com/h/abcs/letter-a/?mg=k",
  B:"https://www.starfall.com/h/abcs/letter-b/?mg=k",
  C:"https://www.starfall.com/h/abcs/letter-c/?mg=k",
  D:"https://www.starfall.com/h/abcs/letter-d/?mg=k",
  E:"https://www.starfall.com/h/abcs/letter-e/?mg=k",
  F:"https://www.starfall.com/h/abcs/letter-f/?mg=k",
  G:"https://www.starfall.com/h/abcs/letter-g/?mg=k",
  H:"https://www.starfall.com/h/abcs/letter-h/?mg=k",
  I:"https://www.starfall.com/h/abcs/letter-i/?mg=k",
  J:"https://www.starfall.com/h/abcs/letter-j/?mg=k",
  K:"https://www.starfall.com/h/abcs/letter-k/?mg=k",
  L:"https://www.starfall.com/h/abcs/letter-l/?mg=k",
  M:"https://www.starfall.com/h/abcs/letter-m/?mg=k",
  N:"https://www.starfall.com/h/abcs/letter-n/?mg=k",
  O:"https://www.starfall.com/h/abcs/letter-o/?mg=k",
  P:"https://www.starfall.com/h/abcs/letter-p/?mg=k",
  Q:"https://www.starfall.com/h/abcs/letter-q/?mg=k",
  R:"https://www.starfall.com/h/abcs/letter-r/?mg=k",
  S:"https://www.starfall.com/h/abcs/letter-s/?mg=k",
  T:"https://www.starfall.com/h/abcs/letter-t/?mg=k",
  U:"https://www.starfall.com/h/abcs/letter-u/?mg=k",
  V:"https://www.starfall.com/h/abcs/letter-v/?mg=k",
  W:"https://www.starfall.com/h/abcs/letter-w/?mg=k",
  X:"https://www.starfall.com/h/abcs/letter-x/?mg=k",
  Y:"https://www.starfall.com/h/abcs/letter-y/?mg=k",
  Z:"https://www.starfall.com/h/abcs/letter-z/?mg=k"
};

let audioCtx=null;
let bgStarted=false;

/* ================= AUDIO INIT ================= */

function initAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }
}
function resumeAudio(){
  if(audioCtx && audioCtx.state==="suspended"){
    audioCtx.resume();
  }
}

/* ================= SOUND ================= */

function coinSound(){
  resumeAudio();
  let o=audioCtx.createOscillator();
  o.frequency.setValueAtTime(700,audioCtx.currentTime);
  o.frequency.linearRampToValueAtTime(1200,audioCtx.currentTime+0.1);
  o.connect(audioCtx.destination);
  o.start();
  setTimeout(()=>o.stop(),120);
}

function failSound(){
  resumeAudio();
  let o=audioCtx.createOscillator();
  o.frequency.setValueAtTime(300,audioCtx.currentTime);
  o.frequency.linearRampToValueAtTime(150,audioCtx.currentTime+0.2);
  o.connect(audioCtx.destination);
  o.start();
  setTimeout(()=>o.stop(),150);
}

function jumpSound(){
  resumeAudio();
  let o=audioCtx.createOscillator();
  o.frequency.setValueAtTime(400,audioCtx.currentTime);
  o.frequency.linearRampToValueAtTime(800,audioCtx.currentTime+0.15);
  o.connect(audioCtx.destination);
  o.start();
  setTimeout(()=>o.stop(),150);
}

/* ================= VOICE ================= */

let voices=[];
speechSynthesis.onvoiceschanged = () => {
  voices = speechSynthesis.getVoices();
};

function getBestVoice(){
  if(!voices.length) voices = speechSynthesis.getVoices();
  return voices.find(v =>
    v.lang.includes("ms") ||
    v.lang.includes("en") &&
    (v.name.toLowerCase().includes("female") ||
     v.name.toLowerCase().includes("girl") ||
     v.name.toLowerCase().includes("zira") ||
     v.name.toLowerCase().includes("samantha"))
  ) || voices[0];
}

function speak(text){
  speechSynthesis.cancel();
  let msg=new SpeechSynthesisUtterance(text);
  msg.voice=getBestVoice();
  msg.rate=1;
  msg.pitch=1.2; 
  speechSynthesis.speak(msg);
}

/* ================= BACKGROUND MUSIC ================= */

let bgMusic=new Audio("https://cdn.pixabay.com/audio/2022/10/25/audio_946b9c0c87.mp3");
bgMusic.loop=true;
bgMusic.volume=0;

function startMusic(){
  if(!bgStarted){
    bgStarted=true;
    bgMusic.play().then(()=>{
      fadeInMusic();
    }).catch(()=>{});
  }
}

function fadeInMusic(){
  let vol=0;
  let fade=setInterval(()=>{
    if(vol<0.15){
      vol+=0.01;
      bgMusic.volume=vol;
    }else{
      clearInterval(fade);
    }
  },200);
}

/* ================= PROGRESS ================= */

function setProgress(step){
  document.getElementById("bar").style.width=
    step===1?"50%":"100%";
}

/* ================= SCAN FIRST ================= */

function startFirstScan(){
  initAudio();
  resumeAudio();
  jumpSound();
  startMusic();

  document.getElementById("reader").style.display="block";
  let scanner = new Html5Qrcode("reader");
  
  scanner.start(
    { facingMode: { exact: "environment" } },
    {
      fps: 15, qrbox: 280,
      videoConstraints: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      showTorchButtonIfSupported: true, showZoomSliderIfSupported: true, defaultZoomValueIfSupported: 1.5
    },
    (text)=>{
      firstBox = text.includes("box=") ? text.split("box=")[1] : text;
      scanner.stop();
      coinSound();
      setProgress(1);
      document.getElementById("result").innerHTML = "✔ Box pertama: <b>" + firstBox + "</b><br>Scan box kedua";
      document.getElementById("btn2").disabled = false;
    }
  ).catch(err => {
      startFirstScanFallback();
  });
}

function startFirstScanFallback(){
  let scanner = new Html5Qrcode("reader");
  scanner.start(
    { facingMode: "environment" },
    {
      fps: 15, qrbox: 280,
      videoConstraints: { width: { ideal: 1280 }, height: { ideal: 720 } },
      showTorchButtonIfSupported: true, showZoomSliderIfSupported: true, defaultZoomValueIfSupported: 1.5
    },
    (text)=>{
      firstBox = text.includes("box=") ? text.split("box=")[1] : text;
      scanner.stop(); coinSound(); setProgress(1);
      document.getElementById("result").innerHTML = "✔ Box pertama: <b>" + firstBox + "</b><br>Scan box kedua";
      document.getElementById("btn2").disabled = false;
    }
  ).catch(err => alert("Gagal membuka kamera belakang."));
}

/* ================= SCAN SECOND ================= */

function startSecondScan(){
  if(!firstBox){
    alert("Scan box pertama dulu!");
    return;
  }

  document.getElementById("reader").style.display="block";
  let scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: { exact: "environment" } },
    {
      fps: 15, qrbox: 280,
      videoConstraints: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      showTorchButtonIfSupported: true, showZoomSliderIfSupported: true, defaultZoomValueIfSupported: 1.5
    },
    (text)=>{
      let secondBox = text.includes("box=") ? text.split("box=")[1] : text;
      scanner.stop();
      setProgress(2);
      check(secondBox);
    }
  ).catch(err => {
      startSecondScanFallback();
  });
}

function startSecondScanFallback(){
  let scanner = new Html5Qrcode("reader");
  scanner.start(
    { facingMode: "environment" },
    {
      fps: 15, qrbox: 280,
      videoConstraints: { width: { ideal: 1280 }, height: { ideal: 720 } },
      showTorchButtonIfSupported: true, showZoomSliderIfSupported: true, defaultZoomValueIfSupported: 1.5
    },
    (text)=>{
      let secondBox = text.includes("box=") ? text.split("box=")[1] : text;
      scanner.stop(); setProgress(2); check(secondBox);
    }
  ).catch(err => console.error(err));
}

/* ================= RESULT & BROWSER LAUNCH ================= */

function check(secondBox){
  let ok = (firstBox === secondBox);

  if(ok){
    coinSound();
    document.getElementById("icon").innerHTML="✔";
    document.getElementById("icon").style.color="#22c55e";
    document.getElementById("lock").innerText="🔓";
    document.getElementById("result").innerHTML="<div class='good'>TAHNIAH ANDA BETUL 🎉</div>";
    
    setTimeout(()=>{
      speak("Tahniah anda betul");
    },200);

    if(videoLinks[firstBox]){
      currentActiveUrl = videoLinks[firstBox];
      setTimeout(() => {
        openMiniBrowser(currentActiveUrl);
      }, 1500);
    }
  } else {
    failSound();
    setTimeout(()=>{
      speak("Salah sila cuba lagi");
    },200);
    showFailGif();
  }

  document.getElementById("btn1").style.display="none";
  document.getElementById("btn2").style.display="none";
  document.getElementById("backBtn").style.display="inline-block";
}

/* ================= FUNGSI OPERASI MINI BROWSER ================= */

function openMiniBrowser(url) {
  document.getElementById("mainGameCard").style.display = "none";
  
  // Set nama tapak pada top bar
  document.getElementById("browserTitle").innerText = url.replace("https://www.", "");
  
  let frame = document.getElementById("miniBrowserFrame");
  let noticeBox = document.getElementById("browserBlockedNotice");
  
  // Set pautan terus ke iframe mini browser
  frame.src = url;
  noticeBox.style.display = "none";
  document.getElementById("miniBrowserArea").style.display = "flex";
  
  // Sistem Pengesan Isu Sekatan: Jika domain mengandungi starfall (yang sah menyekat iframe), aktifkan bantuan mod penuh
  if(url.toLowerCase().includes("starfall.com")) {
    setTimeout(() => {
      document.getElementById("externalLaunchBtn").setAttribute("onclick", `window.open('${url}', '_blank')`);
      noticeBox.style.display = "flex";
    }, 300);
  }
}

function browserBack() {
  try {
    let frame = document.getElementById("miniBrowserFrame");
    frame.contentWindow.history.back();
  } catch(e) {
    // Sekiranya rentas domain (cross-origin) menyekat arahan sajak script, muat semula asal
    browserReload();
  }
}

function browserReload() {
  let frame = document.getElementById("miniBrowserFrame");
  if(currentActiveUrl) frame.src = currentActiveUrl;
}

function closeMiniBrowser() {
  document.getElementById("miniBrowserArea").style.display = "none";
  document.getElementById("miniBrowserFrame").src = "";
  resetGame();
}

function showFailGif(){
  document.getElementById("videoModal").innerHTML = `
    <div style="height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white; font-family: Arial, sans-serif; padding: 20px;">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbXN6Ym90am9vN21ndm14cmMxZndpOHg0ZzZ5d3B5ZzF0bnd5cmh6ciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/E7V3EDm6866fD3wHhS/giphy.gif" style="width:200px; max-width:60%; border-radius:20px; margin-bottom: 10px;">
      <h2 style="font-size: 28px; margin: 10px 0; color: #ef4444;">Alamak! Cuba Lagi 🤭</h2>
      <p style="font-size: 16px; margin-bottom: 20px; color: #cbd5e1;">Kotak tidak sama. Sila imbas semula!</p>
      <button onclick="resetGame()" style="background: #22c55e; color: white; font-size: 18px; font-weight: bold; padding: 12px 30px; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">🔁 KEMBALI</button>
    </div>
  `;
  document.getElementById("videoModal").style.display = "block";
}

/* ================= RESET ================= */

function resetGame(){
  bgMusic.pause();
  bgMusic.currentTime=0;
  location.reload();
}

</script>

</body>
</html>
